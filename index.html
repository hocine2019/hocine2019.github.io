      grd.addColorStop(0, 'rgba(242,196,107,.55)'); grd.addColorStop(0.6, 'rgba(242,154,92,.22)'); grd.addColorStop(1, 'rgba(242,154,92,0)');

        var y = oy + (n - (N - 1) / 2) * sp, ph = Math.cos(t * 6 - n * Math.PI * Math.sin(th0));

:"OECR","nom":"Étude de la Propagation des Ondes Électromagnétiques et Canal Radio","couleur":"#1A3A5C","description":"L'équipe développe des activités de recherche centrées sur la compréhension, la modélisation et l'optimisation de la propagation des ondes radio dans les environnements réels. Ses travaux couvrent la radiofréquence (RF), les composants micro-ondes et le comportement des champs électromagnétiques dans les systèmes de communication modernes.","axes":"Analyse des techniques de transmission avancées | Mesure et caractérisation du canal radio | Modélisation et prédiction de la propagation électromagnétique","chef":"Bensebti Messaoud","chef_id":"MB001"},{"id":"EQ2","acronyme":"SIC","nom":"Système Information & Communication","couleur":"#2D6FA8","description":"L'équipe concentre ses activités sur l'analyse, la modélisation et l'optimisation des systèmes de communication numériques de nouvelle génération.","axes":"Modulation avancée et accès multiple — techniques multiporteuses et schémas MC-IDMA (Multi-Carrier Interleave Division Multiple Access) | Détection et estimation dans les systèmes MIMO (Multiple Input Multiple Output), technologie clé des réseaux modernes","chef":"Anou Abderrahmane","chef_id":"MB013"},{"id":"EQ3","acronyme":"HTI","nom":"Conception de Systèmes Hyperfréquence et Traitement de l'Information","couleur":"#27AE60","description":"L'équipe développe des activités orientées vers la conception, la modélisation et l'optimisation de dispositifs et systèmes RF/micro-ondes pour les réseaux de nouvelle génération. Ses travaux couvrent les aspects matériels (antennes, amplificateurs) et les méthodes numériques avancées pour l'analyse électromagnétique.","axes":"Conception de systèmes hyperfréquences | Amplificateurs de puissance RF à haute linéarité | Conception et optimisation d'antennes multi-bandes | Modélisation électromagnétique par méthodes numériques (FDTD, FEM)","chef":"Djebari Mustapha","chef_id":"MB018"},{"id":"EQ4","acronyme":"ACSF","nom":"Antennes et Communications Sans Fil","couleur":"#E8A020","description":"L'équipe mène des travaux avancés dans le domaine des systèmes rayonnants et des technologies de communication sans fil, avec un intérêt particulier pour la récupération d'énergie électromagnétique et les systèmes multi-bandes pour les applications satellitaires et de navigation.","axes":"Conception d'antennes à haut rendement pour la récupération d'énergie RF | Optimisation des circuits de redressement (RF-to-DC conversion efficiency) | Intégration de systèmes autonomes à faible consommation (IoT, capteurs sans fil)","chef":"Hebib Sami","chef_id":"MB025"},{"id":"EQ5","acronyme":"SRT","nom":"Sécurité dans les Réseaux de Télécommunications","couleur":"#E74C3C","description":"Le programme vise la mise en place de techniques, mécanismes et politiques pour protéger les infrastructures, les données et les services de communication contre les menaces internes et externes.","axes":"Détection et prévention des attaques en temps réel (DDoS, intrusions) avec l'IA | Gestion des incidents de sécurité et récupération rapide | Sécurité des réseaux sans fil (Wi-Fi, 5G) et de l'IoT | Évaluation de la performance et équilibre sécurité/efficacité","chef":"Mehdi Merouane","chef_id":"MB032"},{"id":"EQ6","acronyme":"CNSIA","nom":"Communication Numérique, Signaux et Intelligence Artificielle","couleur":"#8E44AD","description":"L'équipe développe des activités interdisciplinaires à l'interface des communications numériques, du traitement du signal et de l'intelligence artificielle, visant à concevoir des systèmes intelligents, efficaces spectralement et énergétiquement.","axes":"Communications sans fil avancées — efficacité spectrale/énergétique, allocation de ressources radio, architectures 5G/6G | Systèmes multiporteuses et optimisation OFDM (bit loading adaptatif, réduction du PAPR) | Systèmes MIMO et Massive MIMO | Traitement du signal et applications biomédicales (ECG, EEG) | Acoustique des matériaux | Intelligence artificielle appliquée aux communications","chef":"AIT SAADI Hocine","chef_id":"MB044"}],"membres":[{"id":"MB001","civilite":"Mr.","nom_complet":"Bensebti Messaoud","nom_arabe":"بن سبتي مسعود","grade":"Pr","categorie":"Permanent","role":"Chef d'équipe","equipe":"OECR","email":"bensebti_messaoud@univ-blida.dz"},{"id":"MB002","civilite":"Mr.","nom_complet":"Taibi Abdelkader","nom_arabe":"طيبي عبد القادر","grade":"MCA","categorie":"Permanent","role":"Membre","equipe":"OECR","email":"taibi_abdelkader@univ-blida.dz"},{"id":"MB003","civilite":"Mr.","nom_complet":"Bersali Mehdi","nom_arabe":"برصالي  مهدي","grade":"MAA","categorie":"Permanent","role":"Membre","equipe":"OECR","email":""},{"id":"MB004","civilite":"Mr.","nom_complet":"Gharbi Oussama","nom_arabe":"غربي أسامة","grade":"Doctorant LMD","categorie":"Doctorant","role":"Doctorant","equipe":"OECR","email":"gharbi_oussama@univ-blida.dz"},{"id":"MB005","civilite":"Melle","nom_complet":"Fedlaoui Lynda","nom_arabe":"فضلاوي ليندة","grade":"Doctorante LMD","categorie":"Doctorant","role":"Doctorant","equipe":"OECR","email":"fedlaoui_lynda@univ-blida.dz"},{"id":"MB006","civilite":"Melle","nom_complet":"Meraga Amina","nom_arabe":"ميراجا امينة","grade":"Doctorante LMD","categorie":"Doctorant","role":"Doctorant","equipe":"OECR","email":""},{"id":"MB007","civilite":"Melle","nom_complet":"Nesrine guenou","nom_arabe":"نسرين قنو","grade":"Doctorante LMD","categorie":"Doctorant","role":"Doctorant","equipe":"OECR","email":"guenou_nesrine@univ-blida.dz"},{"id":"MB008","civilite":"Mr.","nom_complet":"Sadoun Mohammed seghir","nom_arabe":"سعدون محمد صغير","grade":"Doctorant LMD","categorie":"Doctorant","role":"Doctorant","equipe":"OECR","email":""},{"id":"MB009","civilite":"Mr.","nom_complet":"Ahmed Righi","nom_arabe":"أحمد ريغي","grade":"Doctorant LMD","categorie":"Doctorant","role":"Doctorant","equipe":"OECR","email":""},{"id":"MB010","civilite":"Mr.","nom_complet":"Guidoun Younes","nom_arabe":"جدون يونس","grade":"Doctorant LMD" (function () {

  var API = 'https://script.google.com/macros/s/AKfycbwIxxvxLklTJ1XOvAln8MNp9oefpSLMqmuCTlMYocWtSvezVSRYDr4vNCQgmuA6gx20mg/exec';
  var root = document.getElementById('dic-root'), KEY = 'dic_donnees_v1', done = false;
  function sig(D) { try { var c = JSON.parse(JSON.stringify(D)); delete c.genere_le; return JSON.stringify(c); } catch (e) { return ''; } }

    try { var d = JSON.parse(localStorage.getItem(KEY) || 'null'); if (d && d.genere_le >= (window.DIC_SNAPSHOT.genere_le || '')) return d; } catch (e) {}
